services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: graft
      POSTGRES_PASSWORD: graft
      POSTGRES_DB: graft
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graft -d graft"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - graft-pgdata:/var/lib/postgresql/data

volumes:
  graft-pgdata:
