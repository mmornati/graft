services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: graft
      POSTGRES_PASSWORD: graft
      POSTGRES_DB: graft
    ports:
      # Loopback only: the dev credentials below must not be reachable from the network.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graft -d graft"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/18/docker: mount the parent. The volume
      # name carries the major version so an old graft-pgdata (Postgres 17) volume is never reused.
      - graft-pgdata-18:/var/lib/postgresql

volumes:
  graft-pgdata-18:
