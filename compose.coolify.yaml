# Graft on Coolify (Docker Compose build pack). See docs/deploy/coolify.md.
#
# This stack holds only the Graft code: `migrate`, `server` and `worker`, rebuilt and replaced on
# every deploy. Postgres is a separate Coolify Database resource in the same project, so deploying
# Graft never restarts it. DATABASE_URL is that database's internal URL; for the hostname to
# resolve, this resource must have Advanced → Docker compose → "Connect to predefined network" on.
#
# SERVICE_FQDN_SERVER_3000 is a Coolify magic variable (a domain routed to the server's port 3000).
# Everything marked `:?` must be set in the resource's Environment Variables page. Nothing secret
# belongs in this file.

x-graft-env: &graft-env
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:?}
  GITHUB_APP_ID: ${GITHUB_APP_ID:?}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:?}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GRAFT_MODE_CEILING: ${GRAFT_MODE_CEILING:-report}

# Each Graft service builds the same Dockerfile; they share the build cache. Do not give them a
# common `image:` name: Coolify builds services in parallel and a shared tag makes all but one fail.
x-graft-build: &graft-build
  context: .
  dockerfile: Dockerfile

services:
  migrate:
    build: *graft-build
    command: ["node", "dist/bin/migrate.js", "up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
    restart: "no"
    # Coolify: a one-shot container must not count toward the stack's health.
    exclude_from_hc: true

  server:
    build: *graft-build
    environment:
      <<: *graft-env
      SERVICE_FQDN_SERVER_3000: ""
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build: *graft-build
    command: ["node", "dist/bin/worker.js"]
    environment: *graft-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # The worker serves no HTTP: the image's healthcheck does not apply to it.
    healthcheck:
      disable: true
